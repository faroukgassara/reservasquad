services:
  adminer:
    image: adminer:latest
    container_name: bibliosquad-adminer
    restart: unless-stopped
    ports:
      - '8080:8080'
    environment:
      ADMINER_DEFAULT_SERVER: host.docker.internal
      ADMINER_DESIGN: pepa-linha-dark
    extra_hosts:
      - 'host.docker.internal:host-gateway'
